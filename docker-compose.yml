services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-crawler_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crawler_password}
      POSTGRES_DB: ${DB_NAME:-crawler_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crawler_user} -d ${DB_NAME:-crawler_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  master:
    build:
      context: .
      dockerfile: Dockerfile.master
    ports:
      - "${MASTER_PORT:-8080}:8080"
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://${DB_USER:-crawler_user}:${DB_PASSWORD:-crawler_password}@postgres:5432/${DB_NAME:-crawler_db}?sslmode=disable
      PORT: 8080
      POLITENESS_MS: ${POLITENESS_MS:-1000}
      TASK_LEASE_TIMEOUT_SEC: ${TASK_LEASE_TIMEOUT_SEC:-60}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ENABLE_PRODUCTION_RESET: ${ENABLE_PRODUCTION_RESET:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      MASTER_URL: http://master:8080
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      master:
        condition: service_healthy
    command: ["-timeout", "15"]

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      master:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    profiles: ["monitoring"]
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus

volumes:
  pgdata:
